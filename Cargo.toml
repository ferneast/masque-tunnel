[package]
name = "masque-tunnel"
version = "0.18.0"
edition = "2021"
description = "MASQUE tunnel on quinn+h3: CONNECT-UDP (RFC 9298) and CONNECT-IP (RFC 9484)"

[lib]
name = "masque_tunnel"
path = "src/lib.rs"
# `lib` (rlib) for the bin + tests; `staticlib` for the iOS/tvOS xcframework.
crate-type = ["lib", "staticlib"]

[[bin]]
name = "masque-tunnel"
path = "src/main.rs"

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log", "platform-verifier", "bloom"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
# `prefer-post-quantum` moves X25519MLKEM768 to the head of the key-exchange
# list, so the ClientHello carries a 1216-byte PQ key share and no longer fits
# in one ~1200-byte QUIC Initial. The handshake spills across several Initial
# datagrams, which puts the SNI outside the first one — the only datagram the
# GFW's QUIC SNI filter inspects (USENIX Security 2025). It also matches what
# Chrome and Firefox offer first, so the ClientHello reads less like a bespoke
# stack. Costs ~1.2 KB on the wire per handshake.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "prefer-post-quantum"] }
rustls-pemfile = "2"
# Default TLS trust: the Mozilla CA bundle, so the CONNECT-IP client (incl. iOS)
# verifies public ACME certificates without platform-specific trust glue.
webpki-roots = "0.26"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros", "signal"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
bytes = "1"
url = "2"
log = "0.4"
# TUN device for the CONNECT-IP server and client.
tun-rs = { version = "2.8.7", features = ["async_tokio"] }
# RFC 9110 `Date` header formatting for the decoy responses. A web server that
# omits Date is itself a signal, and neither `http` nor `h3` supplies one.
httpdate = "1"

# h3 0.0.8's `:protocol` pseudo-header parser is a closed enum (webtransport,
# connect-udp) and rejects any other value with H3_MESSAGE_ERROR before the
# request reaches the handler. Vendor the crate with a one-line ConnectIp
# addition so RFC 9484 extended CONNECTs parse. Applies to h3-quinn too.
[patch.crates-io]
h3 = { path = "vendor/h3" }

[dev-dependencies]
# Self-signed certificates for the end-to-end decoy tests.
rcgen = "0.13"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = 3
debug = 0
strip = "symbols"
