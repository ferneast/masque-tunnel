[package]
name = "masque-tunnel"
version = "0.10.0"
edition = "2021"
description = "MASQUE tunnel on quinn+h3: CONNECT-UDP (RFC 9298) and CONNECT-IP (RFC 9484)"

[lib]
name = "masque_tunnel"
path = "src/lib.rs"

[[bin]]
name = "masque-tunnel"
path = "src/main.rs"

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log", "platform-verifier", "bloom"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
url = "2"
log = "0.4"
# CONNECT-IP server TUN device (same crate/version as the quiche stack uses).
tun-rs = { version = "2.8.7", features = ["async_tokio"] }

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = 3
debug = 0
strip = "symbols"
